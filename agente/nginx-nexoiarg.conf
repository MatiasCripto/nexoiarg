# Nginx para nexoiarg.com — sirve la página y reenvía el chat al agente.
#
#   sudo cp nginx-nexoiarg.conf /etc/nginx/sites-available/nexoiarg
#   sudo ln -s /etc/nginx/sites-available/nexoiarg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado lo pone certbot solo:
#   sudo certbot --nginx -d nexoiarg.com -d www.nexoiarg.com

# Tope de pedidos al agente por IP. Es la segunda red: el servicio ya
# limita por su cuenta, pero conviene frenarlo antes de que llegue.
limit_req_zone $binary_remote_addr zone=agente:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name nexoiarg.com www.nexoiarg.com;
    # certbot reemplaza esto por la redirección a https
    return 301 https://nexoiarg.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexoiarg.com;
    # certbot completa ssl_certificate / ssl_certificate_key
    return 301 https://nexoiarg.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexoiarg.com;

    root /var/www/nexoiarg;
    index index.html;

    # ── seguridad ──────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── compresión ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── el agente ──────────────────────────────────────────────────
    location /api/agente {
        limit_req zone=agente burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El modelo puede tardar; el servicio corta solo a los 12 s.
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }

    # Chequeo de salud, sólo desde la propia máquina.
    location /api/agente/salud {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3020/salud;
    }

    # ── estáticos ──────────────────────────────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El HTML no se cachea: si cambiás un precio, se ve enseguida.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

limit_req_zone $binary_remote_addr zone=agente_nexoiarg:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=evento_nexoiarg:10m rate=30r/m;

server {
    server_name nexoiarg.com;
    root /var/www/nexoiarg;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/agente {
        limit_req zone=agente_nexoiarg burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }

    # medición propia: la página manda eventos anónimos acá (sendBeacon).
    # Los recibe el servicio nexo-eventos (localhost:8790) y los guarda
    # en /var/log/nexo-eventos.jsonl. Sin cookies, sin terceros.
    location = /api/evento {
        limit_req zone=evento_nexoiarg burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 8k;
        access_log off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nexoiarg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nexoiarg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nexoiarg.com;
    ssl_certificate /etc/letsencrypt/live/nexoiarg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexoiarg.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://nexoiarg.com$request_uri;
}

server {
    if ($host = www.nexoiarg.com) {
        return 301 https://nexoiarg.com$request_uri;
    } # managed by Certbot

    if ($host = nexoiarg.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name nexoiarg.com www.nexoiarg.com;
    return 404; # managed by Certbot
}

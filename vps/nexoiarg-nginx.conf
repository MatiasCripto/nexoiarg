limit_req_zone $binary_remote_addr zone=agente_nexoiarg:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=evento_nexoiarg:10m rate=30r/m;

server {
    server_name nexoiarg.com;
    root /var/www/nexoiarg;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self' 'sha256-Fj3J6CFlNhGEDn1n+PO6ABsnSAfzxQ19TvBD9jBmJR4='; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /api/agente {
        limit_req zone=agente_nexoiarg burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }

    # medición propia: la página manda eventos anónimos acá (sendBeacon).
    # Los recibe el servicio nexo-eventos (localhost:8790) y los guarda
    # en /var/log/nexo-eventos.jsonl. Sin cookies, sin terceros.
    location = /api/evento {
        limit_req zone=evento_nexoiarg burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 8k;
        access_log off;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* ^/index-backup- {
        return 404;
    }

    location ~ \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nexoiarg.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nexoiarg.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nexoiarg.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    ssl_certificate /etc/letsencrypt/live/nexoiarg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexoiarg.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://nexoiarg.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexoiarg.com www.nexoiarg.com;
    return 301 https://nexoiarg.com$request_uri;
}
